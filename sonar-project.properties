# SonarCloud ayarları.
# <...> ile işaretli yerleri SonarCloud'daki organizasyon ve proje bilgileriyle değiştirin.
sonar.organization=<SONARCLOUD_ORGANIZASYON_ANAHTARI>
sonar.projectKey=<SONARCLOUD_PROJE_ANAHTARI>
sonar.projectName=beyaztakim
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Kaynak ve test klasörleri
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**

# Python
sonar.python.version=3.11
# Rapor, backend/ klasöründe şu komutla üretilir:
#   pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=backend/coverage.xml
