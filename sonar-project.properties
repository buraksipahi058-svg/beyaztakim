# SonarCloud ayarları. Analiz GitHub Actions'tan yapılır (.github/workflows/ci.yml);
# SonarCloud'daki "Automatic Analysis" kapalı olmalıdır.
sonar.organization=buraksipahi058-svg
sonar.projectKey=buraksipahi058-svg_beyaztakim
sonar.projectName=beyaztakim
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Kaynak ve test klasörleri
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**

# Frontend'in otomatik testi yok; kapsama (coverage) yalnızca backend için ölçülür.
# Frontend kodu yine de hata ve kod kokusu (code smell) için analiz edilir.
sonar.coverage.exclusions=frontend/**

# Python
sonar.python.version=3.11
# Rapor, backend/ klasöründe şu komutla üretilir (CI bunu her çalışmada yapar):
#   pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=backend/coverage.xml
