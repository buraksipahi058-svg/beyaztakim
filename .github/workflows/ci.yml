# Otomatik kontroller (CI). Sahibi: 4. kişi (Altyapı)
#
# Her PR'da (açılınca ve her yeni commit'te) ve main'e her birleştirmede çalışır:
# - Backend: testler (pytest) + kapsama raporu (coverage.xml) + SonarCloud analizi
# - Frontend: üretim derlemesi (npm run build)
#
# SonarCloud analizi için repoda SONAR_TOKEN adlı secret olmalıdır
# (Settings → Secrets and variables → Actions). Token yoksa analiz adımı atlanır,
# testler yine çalışır. SonarCloud ayarları: sonar-project.properties

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Aynı PR'a art arda commit gelirse eski çalışma iptal edilir, yalnızca sonuncusu biter.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend testleri ve SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Kodu indir
        uses: actions/checkout@v7
        with:
          # SonarCloud yeni kodu ayırt etmek için git geçmişinin tamamını ister.
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır (kapsama raporuyla)
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term

      - name: SonarCloud analizi
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  frontend:
    name: Frontend derlemesi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Kodu indir
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Paketleri kur
        run: npm ci

      - name: Derle
        run: npm run build
